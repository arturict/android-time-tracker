<text x="1160" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#5C6E85">ActionCallback</text>
<rect x="60" y="625" width="380" height="220" rx="20" fill="#FFF6E5" stroke="#E7C987" stroke-width="2"/>
<text x="85" y="674" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#705016">Boundary timestamp</text>
<text x="85" y="718" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#705016">UTC instant</text>
<text x="85" y="755" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#705016">Device zone + offset</text>
<text x="85" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#705016">Read once per boundary</text>
<polyline points="440,735 500,735" fill="none" stroke="#657892" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="500" y="625" width="800" height="220" rx="22" fill="#172E4B"/>
<text x="535" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">03   TrackerRepository</text>
<text x="535" y="725" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#97E1D3">Shared write path for app + widget</text>
<text x="535" y="772" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#DFEAF6">Validate / serialize / one Room transaction</text>
<text x="535" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#DFEAF6">Close previous at T + start next at T</text>
<rect x="1360" y="625" width="380" height="220" rx="20" fill="#F8FAFD" stroke="#8B9AAF" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1385" y="674" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#536780">Future PC / LAN</text>
<text x="1385" y="716" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#536780">Adapter through repository</text>
<text x="1385" y="753" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#536780">Authenticated sync later</text>
<text x="1385" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#536780">No service in v1</text>
<polyline points="1360,735 1300,735" fill="none" stroke="#657892" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="900,845 900,925" fill="none" stroke="#657892" stroke-width="3" marker-end="url(#arrow)"/>
<text x="930" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C6E85">Atomic write / query</text>
<rect x="500" y="925" width="800" height="240" rx="20" fill="#FFFFFF" stroke="#CFD9E5" stroke-width="2"/>
<text x="530" y="977" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#17283F">04   Room DAO + SQLite</text>
<rect x="530" y="1003" width="740" height="50" rx="10" fill="#EEF3F9"/>
<text x="550" y="1036" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#17283F">activity</text>
<text x="760" y="1035" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#425874">UUID / title / color / order / archived</text>
<rect x="530" y="1065" width="740" height="50" rx="10" fill="#EEF3F9"/>
<text x="550" y="1098" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#17283F">time_interval</text>
<text x="760" y="1097" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#425874">UTC endpoints / zones / active marker</text>
<text x="530" y="1152" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#425874">One open interval maximum / app-private database</text>
<polyline points="500,805 470,805 470,1045 440,1045" fill="none" stroke="#657892" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="925" width="380" height="240" rx="20" fill="#E6F5EF" stroke="#A6D7C5" stroke-width="2"/>
<text x="85" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#175D4C">After commit</text>
<text x="85" y="1022" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#175D4C">App observes saved data</text>
<text x="85" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#175D4C">Refresh every widget</text>
<text x="85" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#175D4C">Show success feedback</text>
<rect x="1360" y="925" width="380" height="240" rx="20" fill="#FFFFFF" stroke="#CFD9E5" stroke-width="2"/>
<text x="1385" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#17283F">Idle by design</text>
<text x="1385" y="1022" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#425874">No running timer</text>
<text x="1385" y="1057" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#425874">No tracking service</text>
<text x="1385" y="1092" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#425874">No periodic polling</text>
<text x="1385" y="1127" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#425874">No GPS or wake lock</text>
<rect x="60" y="1220" width="1680" height="230" rx="20" fill="#FFFFFF" stroke="#CFD9E5" stroke-width="2"/>
<text x="90" y="1269" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#17283F">A press creates a boundary. Time passes without background ticking.</text>
<text x="90" y="1307" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#536780">Pressing the same button again still starts a new interval. Illustrative sequence, not to scale.</text>
<text x="120" y="1345" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#536780">09:00 / Work pressed</text>
<text x="650" y="1345" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#536780">10:15 / Travel pressed</text>
<text x="1180" y="1345" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#536780">10:30 / Travel pressed again</text>
<rect x="120" y="1363" width="518" height="50" rx="10" fill="#19776A"/>
<rect x="650" y="1363" width="518" height="50" rx="10" fill="#7254B8"/>
<rect x="1180" y="1363" width="510" height="50" rx="10" fill="#7254B8"/>
<text x="145" y="1395" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Work  [09:00, 10:15)</text>
<text x="675" y="1395" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Travel  [10:15, 10:30)</text>
<text x="1205" y="1395" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Travel  [10:30, open)</text>
