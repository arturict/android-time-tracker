<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
<title id="title">Android Time Tracker architecture</title><desc id="desc">Kotlin app screens and a Glance home-screen widget share a transactional repository and Room over SQLite. Each press closes the previous interval and starts another at one timestamp. Tracking requires no background timer. A PC or LAN adapter is deferred.</desc>
<rect width="1800" height="1500" fill="#F3F6FA"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 11 6 L 0 11 z" fill="#657892"/></marker></defs>
<rect x="25" y="25" width="1750" height="180" rx="25" fill="#14253E"/>
<text x="60" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#92D9CF">ANDROID TIME TRACKER</text>
<text x="60" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">Simple actions. Durable time history.</text>
<text x="60" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#D6E1EF">Kotlin + Jetpack Compose   /   Glance widget   /   Room + SQLite</text>
<rect x="60" y="245" width="990" height="280" rx="20" fill="#FFFFFF" stroke="#CFD9E5" stroke-width="2"/>
<text x="85" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#17283F">01   APP SCREENS</text>
