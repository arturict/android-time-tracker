<text x="1160" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Work</text>
<text x="1352" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Travel</text>
