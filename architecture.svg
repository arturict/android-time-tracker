<text x="105" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#165E55">Dashboard</text>
<text x="105" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">All activity buttons</text>
<text x="105" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#304E58">Calendar left / Create right</text>
<text x="105" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Safe bottom padding</text>
<text x="423" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#165E55">Calendar</text>
<text x="423" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Day timeline</text>
<text x="423" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Edit starts + ends</text>
<text x="423" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Home shortcut</text>
<text x="741" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#165E55">Button editor</text>
<text x="741" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Title + color + order</text>
<text x="741" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Archive keeps history</text>
<text x="741" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#304E58">Home shortcut</text>
<rect x="1090" y="245" width="650" height="280" rx="20" fill="#FFFFFF" stroke="#CFD9E5" stroke-width="2"/>
<text x="1115" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#17283F">02   HOME-SCREEN WIDGET</text>
<text x="1115" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#5B4C83">Glance / tracker buttons only</text>
<rect x="1120" y="370" width="180" height="66" rx="13" fill="#19776A"/>
<rect x="1317" y="370" width="180" height="66" rx="13" fill="#7254B8"/>
